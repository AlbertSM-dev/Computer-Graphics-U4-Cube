<body>
<div id="container">
</div>
</body>
 <script src="http://uopeopleweb.com/js/jquery-1.10.2.min.js"></script> 
 <script src="http://uopeopleweb.com/three.js/build/three.min.js"></script>
<script src="http://uopeopleweb.com/js/dat.gui.min.js"></script>
<script src="http://uopeopleweb.com/js/OrbitControls.js"></script>
<script src="http://uopeopleweb.com/js/math.js"></script>
<script src="https://threejs.org/examples/js/Detector.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://threejs.org/examples/js/controls/OrbitControls.js"></script>

<script type="text/javascript">

// set the scene size
var WIDTH = 500, HEIGHT = 500;

// set some camera attributes
var VIEW_ANGLE = 45, ASPECT = WIDTH / HEIGHT, NEAR = 1, FAR = 1000;

// get the DOM element to attach to
var container = document.getElementById('container');


// create a WebGL renderer, camera, and a scene
var renderer = new THREE.WebGLRenderer(); 
var scene = new THREE.Scene();
var clock = new THREE.Clock();
var camera = new THREE.PerspectiveCamera(VIEW_ANGLE,ASPECT,NEAR,FAR);
// the camera starts at 0,0,0 so pull it back
camera.position.z = 100;    	
// add the camera to the scene
scene.add(camera)
       
// start the renderer
renderer.setSize(WIDTH, HEIGHT);

// attach the render-supplied DOM element
container.append(renderer.domElement);

	// ----------------------------------------------------------------------------------------
	//  END OF THE STANDARD CODE FOR THE ASSIGNMENT
	//  Following this is where you must place your own custom code to complete the assignment
	// ----------------------------------------------------------------------------------------
// create Cube
const geometry = new THREE.BoxGeometry(15, 15, 15);
// create Textures    
const loader = new THREE.TextureLoader();

// set crossOrigin to anonymous for external images
loader.crossOrigin = '';

// get images random for all audiences
const materialArray = [
    new THREE.MeshBasicMaterial({ map: loader.load('https://picsum.photos/200/300?random=1') }),
    new THREE.MeshBasicMaterial({ map: loader.load('https://picsum.photos/200/300?random=2') }),
    new THREE.MeshBasicMaterial({ map: loader.load('https://picsum.photos/200/300?random=3') }),
    new THREE.MeshBasicMaterial({ map: loader.load('https://picsum.photos/200/300?random=4') }),
    new THREE.MeshBasicMaterial({ map: loader.load('https://picsum.photos/200/300?random=5') }),
    new THREE.MeshBasicMaterial({ map: loader.load('https://picsum.photos/200/300?random=6') }),
];


// materials
const cube = new THREE.Mesh(geometry, materialArray);
scene.add(cube);

// create point ligth
var pointLight = new THREE.PointLight(0xFFFFAA, 1, 1000);
pointLight.position.set( -250, 250, 250 );
scene.add(pointLight); 
  
// ambient light for softer shadows
var ambientLight = new THREE.AmbientLight(0x404040);
scene.add(ambientLight);
  
// control variable
let isRotating = true; // Start with auto-rotate ON
let speedX = 0.01;     // Vertical rotation speed
let speedY = 0.01;     // Horizontal rotation speed

// event listeners

// mouse Click: Pause/Play
document.addEventListener('click', () => {
    isRotating = !isRotating;
});

// arrow Keys: control speed and direction
document.addEventListener('keydown', (event) => {
    const step = 0.005; // How much to change speed per key press

    switch (event.key) {
        case 'ArrowUp':
            speedX += step; // Spin faster vertically
            break;
        case 'ArrowDown':
            speedX -= step; // Spin slower vertically (or reverse)
            break;
        case 'ArrowRight':
            speedY += step; // Spin faster horizontally (Clockwise)
            break;
        case 'ArrowLeft':
            speedY -= step; // Spin slower horizontally (or reverse)
            break;
    }
});
	// Standard functions for rendering the scene.  Notice how we have the animate function 
	// which submits a call to requestAnimationFrame to call animate.   This creates a loop
	// that will render the scene again whenever something within the scene changes.

function animate() {
    requestAnimationFrame(animate);

    // Only rotate if is true
    if (isRotating) {
        // Subtracting creates a clockwise rotation
        cube.rotation.x -= speedX;
        cube.rotation.y -= speedY;
    }

    render();
}

	function render() {
		//cameraControls.update();
		renderer.render(scene, camera);
	}
	animate();
	</script>
